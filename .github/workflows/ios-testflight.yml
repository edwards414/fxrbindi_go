name: ios-testflight

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.41.9"
  BUNDLE_ID: dev.gozero.gozeroGo
  TEAM_ID: 424PMQV2V7
  PROFILE_NAME: AppStore dev.gozero.gozeroGo
  APPSTORE_APP_ID: "6791030701"
  INTERNAL_BETA_GROUP_ID: 6c98530f-88a1-40df-9ca5-0272a0b4634d

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  upload:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate TestFlight credentials
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          for name in APPSTORE_ISSUER_ID APPSTORE_API_KEY_ID \
            APPSTORE_API_PRIVATE_KEY APPSTORE_CERTIFICATES_FILE_BASE64 \
            APPSTORE_CERTIFICATES_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub testflight credential: $name" >&2
              exit 1
            fi
          done

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "~26.4.0"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Import App Store signing certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Resolve version and unique build number
        run: |
          build_name="$(awk '/^version:/ {split($2, value, "+"); print value[1]}' pubspec.yaml)"
          commit_count="$(git rev-list --count HEAD)"
          build_number="${commit_count}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "BUILD_NAME=$build_name" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Building $build_name ($build_number)"

      - name: Prepare Flutter and CocoaPods
        run: |
          flutter pub get
          flutter build ios --config-only --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          cd ios
          pod install

      - name: Archive signed iOS app
        run: |
          set -o pipefail
          mkdir -p build/ios/archive build/ios/logs
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive | tee build/ios/logs/archive.log

      - name: Export IPA
        run: |
          set -o pipefail
          mkdir -p build/ios/upload build/ios/logs
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptionsCI.plist \
            -exportPath build/ios/upload \
            | tee build/ios/logs/export.log
          ipa_path="$(find build/ios/upload -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: app/${{ env.IPA_PATH }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"
          backend: AppStoreAPI

      - name: Distribute to internal testers
        env:
          ASC_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          ASC_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_APP_ID: ${{ env.APPSTORE_APP_ID }}
          ASC_BETA_GROUP_ID: ${{ env.INTERNAL_BETA_GROUP_ID }}
        run: ruby ../scripts/assign_testflight_internal.rb "$BUILD_NUMBER"

      - name: Upload Xcode logs on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-testflight-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/ios/logs
          if-no-files-found: warn
          retention-days: 14
