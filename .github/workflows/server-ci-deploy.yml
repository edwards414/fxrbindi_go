name: server-ci-deploy

on:
  push:
    branches: [main]
    paths:
      - "gozero/**"
      - "tests/**"
      - "app/lib/api.dart"
      - "app/lib/game_page.dart"
      - "app/lib/home_page.dart"
      - "app/test/api_queue_test.dart"
      - "Dockerfile"
      - "requirements-server.txt"
      - "compose.yaml"
      - "deploy/**"
      - "scripts/deploy_server.sh"
      - ".github/workflows/server-ci-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-inference-server
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test inference queue
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile gozero/job_queue.py gozero/server.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true
      - name: Test Flutter queue client
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build server image
        run: docker build --tag gozero-server:ci .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub environment secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Fast-forward and deploy
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          scripts/deploy_server.sh
          REMOTE
