name: server-ci-deploy

on:
  push:
    branches: [main]
    paths:
      - "gozero/**"
      - "tests/**"
      - "app/lib/api.dart"
      - "app/lib/game_page.dart"
      - "app/lib/home_page.dart"
      - "app/test/api_queue_test.dart"
      - "Dockerfile"
      - "requirements-server.txt"
      - "compose.yaml"
      - "runs/v5_19x19/latest.pkl"
      - "runs/v5_19x19/latest.pkl.sha256"
      - "runs/v4/latest.pkl"
      - "runs/v4/latest.pkl.sha256"
      - "deploy/**"
      - "scripts/deploy_server.sh"
      - "scripts/smoke_test_server.py"
      - ".github/workflows/server-ci-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-inference-server
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test inference queue
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile gozero/job_queue.py gozero/server.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true
      - name: Test Flutter queue client
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build server image
        run: docker build --tag gozero-server:ci .

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[no-deploy]')
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verify deployment checkpoints
        shell: bash
        run: |
          for run in runs/v5_19x19 runs/v4; do
            (cd "$run" && sha256sum -c latest.pkl.sha256)
            if grep -q '^version https://git-lfs.github.com/spec/v1$' "$run/latest.pkl"; then
              echo "Git LFS checkpoint was not downloaded: $run/latest.pkl" >&2
              exit 1
            fi
          done

      - name: Validate deployment secrets
        shell: bash
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub environment secret: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Transfer verified checkpoints
        shell: bash
        run: |
          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            runs/v5_19x19/latest.pkl \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.latest-19x19.pkl.ci-upload"
          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            runs/v4/latest.pkl \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.latest-9x9.pkl.ci-upload"

      - name: Fast-forward and deploy
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/main
          for size_run in "19x19:runs/v5_19x19" "9x9:runs/v4"; do
            size="${size_run%%:*}"
            run="${size_run#*:}"
            upload_path="$1/.latest-${size}.pkl.ci-upload"
            model_path="$1/${run}/latest.pkl"
            expected="$(awk '{print $1}' "$1/${run}/latest.pkl.sha256")"
            actual="$(sha256sum "$upload_path" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "uploaded ${size} checkpoint checksum mismatch" >&2
              exit 1
            fi
            mv "$upload_path" "$model_path"
          done
          scripts/deploy_server.sh
          REMOTE
